name: Build & Deploy (backend)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build image & push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image ref
        id: meta
        run: |
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}-backend"
          echo "image=${REPO}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.meta.outputs.repo }}:${{ github.sha }}
            ${{ steps.meta.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-ssm:
    name: Deploy via AWS SSM
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      SSM_DEPLOY_TARGET_TAG: ${{ secrets.SSM_DEPLOY_TARGET_TAG }}
    steps:
      - name: Check AWS configuration
        id: cfg
        run: |
          if [ -n "$AWS_ROLE_ARN" ] && [ -n "$AWS_REGION" ] && [ -n "$SSM_DEPLOY_TARGET_TAG" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS deploy secrets not set (AWS_ROLE_ARN, AWS_REGION, SSM_DEPLOY_TARGET_TAG). Skipping SSM deploy; image is available in GHCR."
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.cfg.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Sends a deploy command to every EC2 instance tagged
      # Deploy=<SSM_DEPLOY_TARGET_TAG>. The instance pulls the new image and
      # restarts the compose stack. The instance's IAM role provides app secrets
      # via SSM Parameter Store (USE_SSM=true in its environment).
      - name: Trigger SSM deploy
        if: steps.cfg.outputs.configured == 'true'
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          set -euo pipefail
          aws ssm send-command \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Deploy,Values=${SSM_DEPLOY_TARGET_TAG}" \
            --comment "Deploy ${IMAGE}" \
            --parameters "commands=[\
              'set -e',\
              'cd /opt/pokemon-auction',\
              'export BACKEND_IMAGE=${IMAGE}',\
              'docker pull ${IMAGE}',\
              'docker compose up -d --no-build',\
              'docker image prune -f'\
            ]" \
            --output text
