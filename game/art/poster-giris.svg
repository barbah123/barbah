    <circle cx="160" cy="560" r="9"/>
    <path d="M 160 560 L 150 585" stroke="#F5EEDC" stroke-width="3"/>
    <circle cx="390" cy="540" r="8"/>
    <path d="M 390 540 L 382 562" stroke="#F5EEDC" stroke-width="3"/>
  </g>

  <!-- KEDI: sapa tutunmus, havada savruluyor -->
  <g transform="translate(445,800) rotate(24)">
    <!-- kuyruk -->
    <path d="M 52 40 Q 120 58 138 6 Q 144 -16 130 -28" stroke="#D97A2E" stroke-width="17" fill="none" stroke-linecap="round"/>
    <path d="M 138 -8 Q 143 -22 130 -28" stroke="#A85A1C" stroke-width="17" fill="none" stroke-linecap="round"/>
    <!-- arka bacaklar (tekme) -->
    <path d="M 62 34 Q 96 62 122 52" stroke="#E8853B" stroke-width="26" fill="none" stroke-linecap="round"/>
    <path d="M 54 50 Q 74 90 104 92" stroke="#D97A2E" stroke-width="26" fill="none" stroke-linecap="round"/>
    <!-- govde -->
    <ellipse cx="18" cy="26" rx="66" ry="44" fill="#E8853B"/>
    <ellipse cx="0" cy="38" rx="36" ry="24" fill="#FCE8C8"/>
    <path d="M 40 -4 Q 56 8 52 24" stroke="#C05F1F" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M 58 8 Q 72 20 66 34" stroke="#C05F1F" stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- kafa -->
    <g transform="translate(-52,-38) rotate(-14)">
      <path d="M -26 -30 L -38 -62 L -6 -44 Z" fill="#E8853B"/>
      <path d="M 26 -30 L 38 -62 L 6 -44 Z" fill="#E8853B"/>
      <path d="M -24 -36 L -31 -52 L -12 -42 Z" fill="#F7B27E"/>
      <path d="M 24 -36 L 31 -52 L 12 -42 Z" fill="#F7B27E"/>
      <circle r="46" fill="#E8853B"/>
      <ellipse cx="0" cy="16" rx="30" ry="20" fill="#FCE8C8"/>
      <!-- gozler: panik ama eglenceli -->
      <ellipse cx="-15" cy="-6" rx="12" ry="15" fill="#FFFFFF"/>
      <ellipse cx="15" cy="-6" rx="12" ry="15" fill="#FFFFFF"/>
      <circle cx="-13" cy="-2" r="6.5" fill="#241407"/>
      <circle cx="17" cy="-2" r="6.5" fill="#241407"/>
      <circle cx="-15" cy="-5" r="2.4" fill="#FFFFFF"/>
      <circle cx="15" cy="-5" r="2.4" fill="#FFFFFF"/>
      <!-- burun + agiz -->
      <path d="M -5 8 L 5 8 L 0 15 Z" fill="#E06A6A"/>
      <path d="M 0 15 Q 0 22 -8 24 M 0 15 Q 0 22 8 24" stroke="#7A4415" stroke-width="3.4" fill="none" stroke-linecap="round"/>
      <path d="M -6 26 Q 0 34 8 27" stroke="#7A4415" stroke-width="3.6" fill="none" stroke-linecap="round"/>
      <!-- biyiklar -->
      <g stroke="#7A4415" stroke-width="2.6" opacity="0.9">
        <path d="M -30 10 L -58 4"/><path d="M -30 16 L -58 18"/>
        <path d="M 30 10 L 58 4"/><path d="M 30 16 L 58 18"/>
      </g>
    </g>
    <!-- on patiler sapi kavriyor (gogus hizasinda) -->
    <path d="M -30 16 Q -18 0 -2 2" stroke="#E8853B" stroke-width="22" fill="none" stroke-linecap="round"/>
    <circle cx="0" cy="2" r="13" fill="#F7B27E"/>
    <path d="M -46 28 Q -38 10 -22 8" stroke="#D97A2E" stroke-width="22" fill="none" stroke-linecap="round"/>
    <circle cx="-20" cy="8" r="13" fill="#F7B27E"/>
  </g>

  <!-- TAVUK: sapin ucunda, panik halinde -->
  <g transform="translate(625,945) rotate(-14)">
    <!-- kuyruk tuyleri -->
    <path d="M 48 -6 Q 92 -34 86 -66" stroke="#EDE7DA" stroke-width="20" fill="none" stroke-linecap="round"/>
    <path d="M 54 4 Q 104 -10 108 -44" stroke="#DFD6C4" stroke-width="20" fill="none" stroke-linecap="round"/>
    <path d="M 56 16 Q 108 14 118 -14" stroke="#EDE7DA" stroke-width="20" fill="none" stroke-linecap="round"/>
    <!-- govde -->
    <ellipse cx="10" cy="18" rx="64" ry="52" fill="#FBF6EA"/>
    <ellipse cx="-6" cy="34" rx="38" ry="26" fill="#EFE3CC"/>
    <!-- kanatlar -->
    <path d="M 34 6 Q 78 26 62 62 Q 36 52 24 34 Z" fill="#F3ECDC" stroke="#D8CCB4" stroke-width="4"/>
    <path d="M -18 2 Q -74 -18 -88 -52 Q -50 -52 -26 -30 Z" fill="#F3ECDC" stroke="#D8CCB4" stroke-width="4"/>
    <!-- bacaklar sallaniyor -->
    <path d="M -6 62 Q -12 96 -34 106" stroke="#E9A13B" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M 26 66 Q 34 100 20 118" stroke="#E9A13B" stroke-width="10" fill="none" stroke-linecap="round"/>
    <g stroke="#E9A13B" stroke-width="8" stroke-linecap="round">
      <path d="M -34 106 L -48 112"/><path d="M -34 106 L -40 118"/><path d="M -34 106 L -26 118"/>
      <path d="M 20 118 L 6 126"/><path d="M 20 118 L 16 132"/><path d="M 20 118 L 30 130"/>
    </g>
    <!-- kafa -->
    <g transform="translate(-44,-44) rotate(-8)">
      <!-- ibik -->
      <circle cx="-12" cy="-38" r="11" fill="#E5453C"/>
      <circle cx="2" cy="-44" r="12" fill="#E5453C"/>
      <circle cx="16" cy="-38" r="11" fill="#E5453C"/>
      <circle r="40" fill="#FBF6EA"/>
      <!-- gozler: kocaman panik -->
      <ellipse cx="-10" cy="-6" rx="12" ry="15" fill="#FFFFFF" stroke="#E4D9C2" stroke-width="2"/>
      <ellipse cx="16" cy="-6" rx="12" ry="15" fill="#FFFFFF" stroke="#E4D9C2" stroke-width="2"/>
      <circle cx="-8" cy="-2" r="6.5" fill="#241407"/>
      <circle cx="18" cy="-2" r="6.5" fill="#241407"/>
      <circle cx="-10" cy="-5" r="2.4" fill="#FFFFFF"/>
      <circle cx="16" cy="-5" r="2.4" fill="#FFFFFF"/>
      <!-- acik gaga (bagiriyor) -->
      <path d="M 2 8 L 34 2 L 8 16 Z" fill="#F2A93B"/>
      <path d="M 4 16 L 30 24 L 6 26 Z" fill="#D98E2B"/>
      <!-- sakal (wattle) -->
      <ellipse cx="4" cy="32" rx="8" ry="12" fill="#E5453C"/>
    </g>
    <!-- kanat ucu sapa uzaniyor -->
  </g>

  <!-- Dusen tuyler -->
  <g fill="#F7F1E3" opacity="0.95">
    <path d="M 700 1120 q 10 -18 22 -8 q -6 20 -22 8" />
    <path d="M 650 1210 q 12 -16 22 -6 q -8 18 -22 6" />
    <path d="M 330 1050 q 10 -16 20 -8 q -6 18 -20 8" />
  </g>

  <!-- Alt bant: bolum adi -->
  <g transform="translate(500,1462)">
    <rect x="-300" y="-34" width="600" height="58" rx="29" fill="#2A160A" opacity="0.82"/>
    <text x="0" y="7" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold"
          font-size="30" fill="#FFD98F" letter-spacing="4">BÖLÜM 1 • PEYNİR KAÇIŞI</text>
  </g>

  <!-- Vinyet -->
  <rect width="1000" height="1500" fill="none"/>
  <radialGradient id="vig" cx="50%" cy="46%" r="75%">
    <stop offset="70%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#3A1A05" stop-opacity="0.55"/>
  </radialGradient>
  <rect width="1000" height="1500" fill="url(#vig)"/>
</svg>
