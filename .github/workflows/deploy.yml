name: Deploy to Cloudflare

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  setup-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend deps
        working-directory: backend
        run: npm install

      - name: Create D1 Database (idempotent)
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DB_ID=$(npx wrangler d1 list --json 2>/dev/null | jq -r '.[] | select(.name=="pokemon-auction-db") | .uuid' || echo "")
          if [ -z "$DB_ID" ]; then
            echo "Creating D1 database..."
            OUTPUT=$(npx wrangler d1 create pokemon-auction-db 2>&1)
            echo "$OUTPUT"
            DB_ID=$(echo "$OUTPUT" | grep -oP 'database_id = "\K[^"]+')
          else
            echo "D1 database already exists: $DB_ID"
          fi
          sed -i "s/database_id = \"placeholder\"/database_id = \"$DB_ID\"/" wrangler.toml
          echo "DB_ID=$DB_ID" >> $GITHUB_ENV

      - name: Create R2 Bucket (idempotent)
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler r2 bucket create pokemon-auction-images 2>&1 || echo "Bucket may already exist, continuing..."

      - name: Run D1 Migrations
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute pokemon-auction-db --file=migrations/0001_init.sql --remote 2>&1 || echo "Migration may already be applied"

      - name: Deploy Worker
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Set JWT Secret
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: echo "$JWT_SECRET" | npx wrangler secret put JWT_SECRET
