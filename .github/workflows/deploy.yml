name: Deploy to Cloudflare

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  setup-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend deps
        working-directory: backend
        run: npm install

      - name: Create D1 Database (idempotent)
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Checking for existing D1 database..."
          DB_LIST=$(npx wrangler d1 list 2>&1)
          echo "$DB_LIST"
          if echo "$DB_LIST" | grep -q "pokemon-auction-db"; then
            echo "Database already exists, fetching ID..."
            DB_ID=$(echo "$DB_LIST" | grep "pokemon-auction-db" | awk '{print $NF}' | tr -d '│ ')
            echo "Found DB_ID: $DB_ID"
          else
            echo "Creating D1 database..."
            CREATE_OUTPUT=$(npx wrangler d1 create pokemon-auction-db 2>&1)
            echo "$CREATE_OUTPUT"
            DB_ID=$(echo "$CREATE_OUTPUT" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}')
            echo "Created DB_ID: $DB_ID"
          fi
          if [ -z "$DB_ID" ]; then
            echo "ERROR: Could not determine database ID"
            exit 1
          fi
          sed -i "s/database_id = \"placeholder\"/database_id = \"$DB_ID\"/" wrangler.toml
          echo "Updated wrangler.toml with database_id: $DB_ID"
          cat wrangler.toml

      - name: Create R2 Bucket (idempotent)
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler r2 bucket create pokemon-auction-images 2>&1 || echo "Bucket may already exist, continuing..."

      - name: Run D1 Migrations
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute pokemon-auction-db --file=migrations/0001_init.sql --remote 2>&1

      - name: Deploy Worker
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Set JWT Secret
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: echo "$JWT_SECRET" | npx wrangler secret put JWT_SECRET
