name = "borsa-paper-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
account_id = "3e1b8b1eb88b15ef011e981b60b05e77"

# Web arayüzü aynı Worker'dan servis edilir
[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "borsa-paper-db"
database_id = "placeholder"

# Kendine servis bağlantısı: /api/cron/tick her işi ayrı bir alt-çağrıda
# çalıştırır; her alt-çağrı KENDİ 50 alt-istek bütçesini alır. Tek istekte
# cycle+trader koşunca bütçe tükenip Telegram gönderimi düşüyordu (17 Tem).
[[services]]
binding = "SELF"
service = "borsa-paper-api"

# 1) ABD piyasa saatlerinde (UTC 13-21, hafta içi) her 5 dakikada:
#    açık limit emirleri işle + stratejileri çalıştır (sinyaller Telegram'a gider)
# 2) Günde 3 kez (açılış sonrası, öğlen, kapanış öncesi): day-trade taraması → Telegram
# 3) Her 10 dakikada: otonom trader döngüsü (analiz+risk+giriş/çıkış) + Telegram raporu
#    (SCAN_CRON / TRADER_CRON sabitleri src/index.ts içinde — birlikte değiştirin)
[triggers]
crons = ["*/5 13-21 * * 1-5", "40 13,17,19 * * 1-5", "*/10 13-20 * * 1-5"]
